name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing in the gate writes to the repository, and the Postman CLI runs in this job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Node major `engines` admits, which is `>=22`.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The run suite executes collections with the Postman CLI, the runner a team uses; the suite
      # fails, rather than skips, when the binary is missing. A third-party binary runs here with the
      # repository checked out, so it is fetched by version and refused unless it matches the digest
      # recorded below. Postman's installer script fetches whatever is latest and checks nothing.
      - name: Install the Postman CLI
        env:
          POSTMAN_CLI_VERSION: 1.56.1
          POSTMAN_CLI_SHA256: 1169c039d5102d2c2eadec563fd7f0f8fdbf2ad7fed4bf728d2658a3bbb50105
        run: |
          curl -fsSL -o "$RUNNER_TEMP/postman-cli.tar.gz" "https://dl-cli.pstmn.io/download/version/$POSTMAN_CLI_VERSION/linux64"
          echo "$POSTMAN_CLI_SHA256  $RUNNER_TEMP/postman-cli.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/postman-cli"
          tar -xzf "$RUNNER_TEMP/postman-cli.tar.gz" -C "$RUNNER_TEMP/postman-cli"
          mv "$RUNNER_TEMP/postman-cli/postman-cli" "$RUNNER_TEMP/postman-cli/postman"
          echo "$RUNNER_TEMP/postman-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/postman-cli/postman" --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # LAST, always: it checks the tests too, and a green suite is not a clean typecheck.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
